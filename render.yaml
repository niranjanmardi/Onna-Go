databases:
  - name: onna-go-postgres
    databaseName: onnago
    user: onnago_user
    plan: free # Note: Render free tier PostgreSQL instances expire after 30 days. For permanent production durability, use Starter plan ($7/mo) or link an external managed PostgreSQL (e.g. Supabase, Neon, or AWS RDS).

services:
  - type: web
    name: onna-go
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: onna-go-postgres
          property: connectionString


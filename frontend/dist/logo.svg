<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="onnagoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="onnagoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#onnagoGrad)" filter="url(#onnagoShadow)" />
  
  <!-- Journey Road Curves (Interconnected Twin Paths) -->
  <path d="M 24 74 C 36 52, 64 52, 76 74" stroke="rgba(255,255,255,0.22)" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 32 80 C 42 66, 58 66, 68 80" stroke="rgba(255,255,255,0.4)" stroke-dasharray="3 4" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- The Bold 'O' + Forward Kinetic Arrow / Ride Loop -->
  <circle cx="48" cy="45" r="23" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Dynamic Forward Vibe Accent (Speed Arrow merging with circle) -->
  <path d="M 48 22 C 60 22, 72 32, 72 45 C 72 58, 62 67, 50 68" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" />
  
  <!-- Kinetic Connection Node (Friendship beacon) -->
  <circle cx="70" cy="40" r="5" fill="#FBBF24" />
  <circle cx="26" cy="50" r="4" fill="#38BDF8" />
</svg>

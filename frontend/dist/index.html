    <!-- Early Zero-FOWT Theme Script (Runs synchronously before first paint) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('onnago_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#0A0A0A');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.removeAttribute('data-theme');
            document.documentElement.style.colorScheme = 'light';
            if (meta) meta.setAttribute('content', '#16834A');
          }
        } catch (e) {}
      })();
    </script>

r-top-color:var(--splash-green);border-radius:50%;width:32px;height:32px;margin:8px 0;animation:.8s linear infinite splash-spin}.splash-title{color:var(--splash-text);min-height:22px;margin-top:14px;font-size:15px;font-weight:600}.splash-submessage{color:var(--splash-subtext);min-height:20px;margin-top:4px;font-size:13px;transition:opacity .25s}.splash-elapsed-hint{border:1px solid var(--splash-border);color:#666660;background:#f0f0ed;border-radius:9999px;margin-top:16px;padding:6px 14px;font-size:11.5px;line-height:1.4;display:none}.splash-error-box{text-align:center;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;margin-top:20px;padding:14px 18px;display:none}.splash-retry-btn{background:var(--splash-green);color:#fff;cursor:pointer;border:none;border-radius:10px;margin-top:12px;padding:9px 20px;font-size:13px;font-weight:600;transition:background .15s,transform .1s}.splash-retry-btn:hover{background:#136f3f}.splash-retry-btn:active{transform:scale(.97)}@keyframes splash-spin{to{transform:rotate(360deg)}}@keyframes splash-pulse{0%,to{opacity:.3;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}@media (prefers-reduced-motion:reduce){#splash-screen,.splash-spinner,.splash-icon-pulse{transition:none!important;animation:none!important}}</style>

    <!-- Global Early Diagnostic Handler -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('[ONNA-GO Global Error]', e);
        var errBanner = document.getElementById('onna-early-error');
        if (errBanner) {
          errBanner.style.display = 'block';
          errBanner.innerText = 'Script Error: ' + (e.message || e.error || 'Failed to load module') + ' (' + (e.filename ? e.filename.split('/').pop() : 'script') + ':' + (e.lineno || 0) + ')';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[ONNA-GO Unhandled Rejection]', e);
      });
    </script>

    <!-- Health Check & Wake-Up Controller Script -->
    <script>
      (function() {
        // --- 1. IMMEDIATE OFFLINE BAILOUT ---
        // Runs in the VERY FIRST lines of the inline script before any /health fetch or timer setup.
        // If the browser is offline at startup, immediately remove/hide the splash screen
        // so the app mounts instantly without any /health calls or wake-up messages.
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          var initialSplash = document.getElementById('splash-screen');
          if (initialSplash) {
            initialSplash.style.display = 'none';
            if (initialSplash.parentNode) {
              initialSplash.parentNode.removeChild(initialSplash);
            }
          }
          window.__onReactMounted = function() {};
          return;
        }

        // --- 2. ONLINE STARTUP CONTROLLER ---
        var startTime = Date.now();
        var wakeUpTriggered = false;
        var healthCheckComplete = false;
        var reactMounted = false;
        var currentRetryDelay = 1500;
        var timeoutLimit = 90000; // 90 seconds
        var slowThreshold = 2000; // 2 seconds
        var elapsedHintThreshold = 15000; // 15 seconds
        
        var friendlyMessages = [
          "Packing the snacks for the road...",
          "Warming up the engine...",
          "Checking tyre pressures & route maps...",
          "Connecting riders & splitting fares...",
          "Almost there, putting helmets on...",
          "Syncing travel groups...",
          "Fueling up for the journey..."
        ];
        var msgIndex = 0;
        var msgInterval = null;
        var slowTimer = null;
        var elapsedHintTimer = null;
        var timeoutTimer = null;
        var retryTimeout = null;

        function updateMessage(text) {
          var el = document.getElementById('splash-submessage');
          if (el) {
            el.style.opacity = '0.3';
            setTimeout(function() {
              el.innerText = text;
              el.style.opacity = '1';
            }, 150);
          }
        }

        function showWakeUpState() {
          if (wakeUpTriggered || healthCheckComplete) return;
          wakeUpTriggered = true;
          var titleEl = document.getElementById('splash-title');
          var subEl = document.getElementById('splash-submessage');
          if (titleEl) titleEl.innerText = "Waking things up...";
          if (subEl) subEl.innerText = friendlyMessages[0];

          msgInterval = setInterval(function() {
            if (healthCheckComplete) {
              if (msgInterval) clearInterval(msgInterval);
              return;
            }
            msgIndex = (msgIndex + 1) % friendlyMessages.length;
            updateMessage(friendlyMessages[msgIndex]);
          }, 3200);
        }

        function showElapsedHint() {
          var hintEl = document.getElementById('splash-elapsed-hint');
          if (hintEl && !healthCheckComplete) {
            hintEl.style.display = 'inline-block';
          }
        }

        function showTimeoutError() {
          if (healthCheckComplete) return;
          if (msgInterval) clearInterval(msgInterval);
          var titleEl = document.getElementById('splash-title');
          var subEl = document.getElementById('splash-submessage');
          var hintEl = document.getElementById('splash-elapsed-hint');
          var ringEl = document.getElementById('splash-loading-ring');
          var errEl = document.getElementById('splash-error-box');

          if (titleEl) titleEl.innerText = "Waking up took longer than expected";
          if (subEl) subEl.innerText = "Your free cloud instance might need another wake-up nudge.";
          if (hintEl) hintEl.style.display = 'none';
          if (ringEl) ringEl.style.display = 'none';
          if (errEl) errEl.style.display = 'block';
        }

        function clearAllTimers() {
          if (msgInterval) { clearInterval(msgInterval); msgInterval = null; }
          if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
          if (elapsedHintTimer) { clearTimeout(elapsedHintTimer); elapsedHintTimer = null; }
          if (timeoutTimer) { clearTimeout(timeoutTimer); timeoutTimer = null; }
          if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }
        }

        function dismissSplash() {
          clearAllTimers();
          var splash = document.getElementById('splash-screen');
          if (!splash) return;

          var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (prefersReduced) {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
            return;
          }

          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 250);
        }

        function checkReady() {
          if (healthCheckComplete) {
            if (reactMounted) {
              dismissSplash();
            } else {
              // Safety fallback: if health is done, ensure splash is dismissed after 200ms even if mount event is delayed
              setTimeout(dismissSplash, 200);
            }
          }
        }

        window.__onReactMounted = function() {
          reactMounted = true;
          if (healthCheckComplete) {
            dismissSplash();
          }
        };

        window.__retrySplashConnection = function() {
          var ringEl = document.getElementById('splash-loading-ring');
          var errEl = document.getElementById('splash-error-box');
          var titleEl = document.getElementById('splash-title');
          if (ringEl) ringEl.style.display = 'block';
          if (errEl) errEl.style.display = 'none';
          if (titleEl) titleEl.innerText = "Waking things up...";
          startTime = Date.now();
          wakeUpTriggered = false;
          currentRetryDelay = 1500;
          showWakeUpState();
          ping();
        };

        // Offline event listener: dismiss splash immediately if network drops while waiting
        window.addEventListener('offline', function() {
          healthCheckComplete = true;
          clearAllTimers();
          dismissSplash();
        });

        // Online event listener: run quiet background health check when reconnected
        window.addEventListener('online', function() {
          fetch('/health', {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          })
          .then(function(res) {
            if (res.ok) {
              window.dispatchEvent(new CustomEvent('onnago:server-healthy'));
            }
          })
          .catch(function() {
            // Quiet background failure
          });
        });

        // Start slow timer to detect delays (>2s) for Render cold start
        slowTimer = setTimeout(showWakeUpState, slowThreshold);
        elapsedHintTimer = setTimeout(showElapsedHint, elapsedHintThreshold);
        timeoutTimer = setTimeout(showTimeoutError, timeoutLimit);

        function ping() {
          if (healthCheckComplete) return;

          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            healthCheckComplete = true;
            clearAllTimers();
            dismissSplash();
            return;
          }

          var pingStart = Date.now();
          var controller = window.AbortController ? new AbortController() : null;
          var timeoutId = controller ? setTimeout(function() { controller.abort(); }, 8000) : null;
          
          fetch('/health', {
            method: 'GET',
            signal: controller ? controller.signal : undefined,
            headers: { 'Accept': 'application/json' }
          })
          .then(function(res) {
            if (timeoutId) clearTimeout(timeoutId);
            if (res.ok) {
              healthCheckComplete = true;
              clearAllTimers();
              checkReady();
            } else if (res.status === 502 || res.status === 503 || res.status === 504) {
              // Real Render cold start! Show "Waking things up..." and retry
              showWakeUpState();
              scheduleRetry();
            } else {
              // Other status - complete health check so app can mount
              healthCheckComplete = true;
              clearAllTimers();
              checkReady();
            }
          })
          .catch(function(err) {
            if (timeoutId) clearTimeout(timeoutId);
            var pingDuration = Date.now() - pingStart;

            // Instant network error (failed quickly <2s, e.g. server down or airplane mode):
            // Treat as "no connection" -> mount app in offline mode immediately.
            // Do NOT show "Waking things up...". Do NOT retry.
            if (pingDuration < slowThreshold || (typeof navigator !== 'undefined' && navigator.onLine === false)) {
              healthCheckComplete = true;
              clearAllTimers();
              dismissSplash();
              return;
            }

            // If the request was actually slow (>2s) or timeout reached:
            showWakeUpState();

            if (Date.now() - startTime >= timeoutLimit) {
              showTimeoutError();
              return;
            }
            scheduleRetry();
          });

          function scheduleRetry() {
            var jitter = (Math.random() - 0.5) * 600;
            var nextDelay = Math.min(Math.max(1000, currentRetryDelay + jitter), 8000);
            currentRetryDelay = Math.min(currentRetryDelay * 1.5, 8000);
            retryTimeout = setTimeout(ping, nextDelay);
          }
        }

        ping();
      })();
    </script>
